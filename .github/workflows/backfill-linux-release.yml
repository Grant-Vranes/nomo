name: Backfill Linux release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 已存在的稳定版 Release 标签
        required: true
        default: v0.6.0
        type: string
      source_ref:
        description: 包含 Linux 适配且版本匹配的已审核源码提交
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: backfill-linux-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  backfill:
    name: Build and publish Linux x64 packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout audited build source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          path: build-source
          persist-credentials: false

      - name: Validate version and snapshot existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f ".github/release-notes/$RELEASE_TAG.md"
          python3 - <<'PY'
          import json, os, pathlib, tomllib
          root = pathlib.Path('build-source')
          expected = os.environ['RELEASE_TAG'][1:]
          versions = {
              'package.json': json.loads((root / 'package.json').read_text(encoding='utf-8'))['version'],
              'tauri.conf.json': json.loads((root / 'src-tauri/tauri.conf.json').read_text(encoding='utf-8'))['version'],
              'Cargo.toml': tomllib.loads((root / 'src-tauri/Cargo.toml').read_text(encoding='utf-8'))['package']['version'],
          }
          if any(version != expected for version in versions.values()):
              raise SystemExit(f'Version mismatch: expected {expected}, found {versions}')
          print(f'Validated release version: {expected}')
          PY
          source_commit="$(git -C build-source rev-parse HEAD)"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-before.json"
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false' "$RUNNER_TEMP/release-before.json"
          if jq -e '.assets[] | select(.name | test("\\.(deb|rpm)$"))' "$RUNNER_TEMP/release-before.json" >/dev/null; then
            echo 'Linux packages already exist; refusing to overwrite them.' >&2
            exit 1
          fi
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' > "$RUNNER_TEMP/tag-before.txt"
          jq '[.assets[] | select(.name != "checksums.md5") | {id, name, size, digest}] | sort_by(.name)' "$RUNNER_TEMP/release-before.json" > "$RUNNER_TEMP/protected-assets-before.json"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.1 --activate

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: build-source
        run: pnpm install --frozen-lockfile

      - name: Build Linux packages
        working-directory: build-source
        run: pnpm exec tauri build --bundles deb,rpm

      - name: Inspect packages and shared libraries
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          deb="build-source/src-tauri/target/release/bundle/deb/Nomo_${version}_amd64.deb"
          rpm="build-source/src-tauri/target/release/bundle/rpm/Nomo-${version}-1.x86_64.rpm"
          [[ "$(dpkg-deb -f "$deb" Version)" == "$version" ]]
          [[ "$(dpkg-deb -f "$deb" Architecture)" == 'amd64' ]]
          [[ "$(rpm -qp --queryformat '%{VERSION}' "$rpm")" == "$version" ]]
          [[ "$(rpm -qp --queryformat '%{ARCH}' "$rpm")" == 'x86_64' ]]
          ldd build-source/src-tauri/target/release/nomo > "$RUNNER_TEMP/linux-libraries.txt"
          if grep -F 'not found' "$RUNNER_TEMP/linux-libraries.txt"; then
            exit 1
          fi
          sha256sum "$deb" "$rpm"

      - name: Publish packages, checksums and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          deb="build-source/src-tauri/target/release/bundle/deb/Nomo_${version}_amd64.deb"
          rpm="build-source/src-tauri/target/release/bundle/rpm/Nomo-${version}-1.x86_64.rpm"
          # 仅添加 Linux 包；已有安装包不使用 --clobber。
          gh release upload "$RELEASE_TAG" "$deb" "$rpm"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-after.json"
          jq '[.assets[] | select(.name != "checksums.md5" and (.name | test("\\.(deb|rpm)$") | not)) | {id, name, size, digest}] | sort_by(.name)' "$RUNNER_TEMP/release-after.json" > "$RUNNER_TEMP/protected-assets-after.json"
          cmp "$RUNNER_TEMP/protected-assets-before.json" "$RUNNER_TEMP/protected-assets-after.json"
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' > "$RUNNER_TEMP/tag-after.txt"
          cmp "$RUNNER_TEMP/tag-before.txt" "$RUNNER_TEMP/tag-after.txt"

          checksum_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --dir "$checksum_dir"
          mapfile -d '' files < <(find "$checksum_dir" -maxdepth 1 -type f ! -name 'checksums.md5' -print0 | sort -z)
          : > "$RUNNER_TEMP/checksums.md5"
          for file in "${files[@]}"; do
            printf '%s  %s\n' "$(md5sum "$file" | awk '{print $1}')" "$(basename "$file")" >> "$RUNNER_TEMP/checksums.md5"
          done
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/checksums.md5" --clobber
          cp ".github/release-notes/$RELEASE_TAG.md" "$RUNNER_TEMP/release-notes.md"
          printf '\n\nLinux 包构建源码：[%s](https://github.com/%s/commit/%s)。\n' "$SOURCE_COMMIT" "$GH_REPO" "$SOURCE_COMMIT" >> "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          printf 'Release: https://github.com/%s/releases/tag/%s\n\nLinux source: %s\n' "$GH_REPO" "$RELEASE_TAG" "$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger download site deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync-pages-notes.yml --ref master
